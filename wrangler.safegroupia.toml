# Producao: Worker na conta Cloudflare do cliente (Safegrouporg), servido em
# safegroupia.com. O wrangler.toml principal continua a publicar o preview da
# Growth Hub em safe.methodgrowthhub.com.br, a partir do mesmo codigo.
#
# Sem account_id de proposito: o token desta conta so tem acesso a ela, o
# wrangler resolve a conta sozinho e o repositorio e publico.
name = "safe-group-site"
main = ".open-next/worker.js"
compatibility_date = "2026-08-24"
compatibility_flags = ["nodejs_compat"]

# O apex entra como rota de zona, e nao como custom domain, porque ja tinha
# registos A e AAAA proxied de um alojamento anterior. Esses registos sozinhos
# davam erro 1000, por apontarem para IPs da propria Cloudflare; a rota apanha
# o pedido no edge antes de haver origem para contactar, e serve o Worker sem
# ser preciso mexer no DNS do cliente.
routes = [
  { pattern = "safegroupia.com/*", zone_name = "safegroupia.com" },
  { pattern = "www.safegroupia.com", custom_domain = true }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
