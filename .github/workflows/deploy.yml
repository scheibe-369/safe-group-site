name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run lint

      # Producao. O NEXT_PUBLIC_SITE_URL entra no bundle, por isso a producao
      # precisa do seu proprio build: e dele que saem o canonical, o sitemap,
      # o robots e a validacao de origem do formulario.
      - name: Build for Cloudflare (producao)
        run: npm run build:cloudflare
        env:
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          NEXT_PUBLIC_SITE_URL: https://safegroupia.com

      # O wrangler guarda a conta escolhida em node_modules/.cache/wrangler e
      # reutiliza-a no comando seguinte. Com duas contas no mesmo job, isso faz
      # o segundo deploy bater na conta errada e devolver erro 10000. Limpar a
      # cache antes de cada deploy resolve, e evita gravar ids de conta neste
      # repositorio, que e publico.
      - name: Deploy Worker (producao, safegroupia.com)
        run: rm -rf node_modules/.cache/wrangler && npx wrangler deploy --config wrangler.safegroupia.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_SAFEGROUPIA }}

      # Preview da Growth Hub, sem NEXT_PUBLIC_SITE_URL, como sempre esteve.
      - name: Build for Cloudflare (preview)
        run: npm run build:cloudflare
        env:
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}

      - name: Deploy Worker (preview, safe.methodgrowthhub.com.br)
        run: rm -rf node_modules/.cache/wrangler && npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
